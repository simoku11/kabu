services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kabu
      POSTGRES_USER: kabu
      POSTGRES_PASSWORD: kabu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabu -d kabu"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - kabu-postgres:/var/lib/postgresql/data

volumes:
  kabu-postgres:
